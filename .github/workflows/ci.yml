# The gates that keep the security properties in SECURITY.md true.
#
# These suites only protect anything if they run without being remembered, so
# they run on every push and pull request. `npm test` chains four of them: the
# .docx round-trip suite, the sanitizer regression suite (scripts and remote
# images must not survive an import), the save-model component tests, and an
# npm audit gate. The pagination tests need a real browser and run separately.
#
# Actions are pinned to full commit SHAs, not tags. A tag is mutable — whoever
# controls an action's repository can repoint `v7` at new code, and every
# workflow using it picks that up silently on the next run. This job holds no
# secrets today (write has no release workflow on main; the signed-updater one
# lives only on archive/signed-updater), so a compromised action could only
# tamper with test output — but pin now rather than retrofit it the day that
# stops being true. The trailing comment records which tag each SHA came from;
# Dependabot reads that format and keeps the two in sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Tests, sanitizer, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # jsdom 30 (the new component-test tier) hard-requires Node
          # ^22.22.2 || ^24.15.0 || >=26 -- it throws on 20 at import time
          # (undici's markAsUncloneable isn't there yet), not just untested.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # --ignore-scripts: a compromised package's payload almost always runs
      # from an install lifecycle hook, before any of our code does. No
      # package in this tree declares preinstall/install/postinstall, so
      # nothing is suppressed — this only removes the path. The `prebuild`
      # script below is ours and still runs; the flag applies to this command
      # only, not to later `npm run`.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Round-trip, sanitizer, and audit
        run: npm test

  browser:
    name: Pagination (real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      # Playwright's browser download is an explicit step, not an install
      # hook, so --ignore-scripts above doesn't affect it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Pagination tests
        # The pagination engine reads real layout, so jsdom cannot reach it.
        # This tier exists because a pagination bug shipped twice for exactly
        # that reason; running it only locally puts it on the honour system.
        run: npm run test:e2e

  # Licence policy, not vulnerabilities — cargo audit answers "is anything
  # known-broken?", this answers "may we actually ship this?". write is
  # GPL-3.0-or-later, which absorbs permissive dependencies but genuinely
  # cannot combine with GPL-2.0-only or proprietary terms. THIRD-PARTY-
  # NOTICES.md is the human-readable half; this is the half that runs without
  # being remembered. Policy and reasoning live in app/src-tauri/deny.toml.
  licenses:
    name: cargo deny (licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: app/src-tauri/Cargo.toml
          command: check licenses

  rust:
    name: cargo test + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `stable` here is a branch, not even a tag — it moves under us on every
      # toolchain release. Pinned to the same commit as PwrMon's and Mini
      # Chat's release workflows use for the same action.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Linux needs the WebKitGTK backend present just to compile the crate.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            librsvg2-dev build-essential curl wget file
      - name: Rust tests
        working-directory: app/src-tauri
        # allowed_link's scheme check is the second of the two locks on
        # opening a link out of someone else's document, and the only one
        # written in Rust. It is unit-tested precisely so it can be checked
        # without a running app — which is worth nothing if nothing runs it.
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: app/src-tauri
        # Plain `cargo audit` fails on advisories and only warns on
        # unmaintained/unsound crates. That distinction matters here: Tauri's
        # Linux path pulls in the unmaintained GTK3 bindings and an unsound
        # glib iterator, neither of which we can act on. Denying warnings
        # would make this job red forever and train everyone to ignore it.
        run: cargo audit

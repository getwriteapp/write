# Dependency updates.
#
# `write` parses .docx files from strangers, and the parsing libraries
# (fast-xml-parser, fflate) are the ones actually exposed to that input — so
# an unnoticed advisory in a transitive dep is the realistic way this app gets
# a vulnerability. Weekly is often enough for a project this size; grouping
# keeps it to a couple of PRs rather than a drip.
#
# `cooldown` holds each new release for a few days before it is offered. When
# a package account is compromised, the bad version is usually caught and
# yanked inside a day or two, and the people it reaches are the ones who
# upgraded within hours of publication. Nothing here needs a dependency the
# day it ships, so the wait is free. This delays *version* updates only — a
# real advisory arrives via security updates and is not held back.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      fontsource:
        patterns: ["@fontsource*/*"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
    ignore:
      # Tiptap 3 is a deliberate non-upgrade: its
      # extension packages dropped default exports, which breaks the build
      # outright -- and the real risk isn't the build, it's that a *green*
      # build there proves nothing, because the failure mode on genuine
      # incompatibility is silent document corruption, not a build error.
      # Every weekly PR the grouped update above files is this same major
      # bump restated; ignoring it here stops the noise at the source rather
      # than closing the same PR by hand each week.
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      tauri:
        patterns: ["tauri*"]
    ignore:
      # The GTK/GLib stack reaches this tree only through Tauri's Linux path
      # and is never compiled on Windows -- `cargo tree -i glib` on the
      # default target prints "nothing to print". Nothing here depends on any
      # of it directly, so Dependabot cannot raise it on its own and fails the
      # update run every week instead. That is unactionable red, and standing
      # red is worse than no signal: it is the thing that teaches you to stop
      # reading these alerts. Real advisories still arrive through security
      # updates, which `ignore` does not suppress.
      #
      # NOTE: this is the same stack behind the `cargo audit` warnings. Of
      # those 17, eleven really are Linux-only GTK/GLib -- but five `unic-*`
      # crates are NOT: they ship on Windows via urlpattern -> tauri-utils.
      # Do not widen this ignore list on the assumption that everything
      # Tauri-transitive is inert on Windows.
      - dependency-name: "glib*"
      - dependency-name: "gtk*"
      - dependency-name: "gdk*"
      - dependency-name: "atk*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

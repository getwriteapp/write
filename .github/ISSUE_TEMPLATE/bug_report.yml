name: Bug report
description: Something is broken, looks wrong, or a document didn't survive the trip
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the Commander (Ctrl+K). Include your Windows version.
      placeholder: "write 0.3.0, Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: The document
      description: >
        If a document is involved, attach it — a small excerpt that still
        reproduces the problem is ideal. Files that break round-tripping become
        permanent test fixtures. Don't attach anything you can't share.
  - type: checkboxes
    id: not-security
    attributes:
      label: Confirm
      options:
        - label: This is not a security issue (those go through private reporting — see SECURITY.md)
          required: true

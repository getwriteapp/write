# Licence policy for the Rust dependency tree, enforced in CI.
#
# write ships under GPL-3.0-or-later (see ../../LICENSE), which inverts the
# usual question. A GPLv3 work can absorb almost any permissive dependency, so
# the risk is not "did something copyleft get in" — it is the narrower set of
# licences GPLv3 genuinely cannot combine with:
#
#   - GPL-2.0-only. Compatible with GPLv3 only via the "or later" clause; a
#     crate that is 2.0-*only* cannot be linked into a GPLv3 binary at all.
#   - Proprietary, source-available, and non-commercial terms.
#   - Anything cargo-deny cannot identify with confidence, which is the same
#     problem wearing a different hat.
#
# So this list is permissive-plus-GPL-compatible, and anything outside it
# stops the build rather than shipping on the assumption that GPL absorbs
# everything. It does not.
#
# THIRD-PARTY-NOTICES.md is the human-readable half of this and is copied into
# the app at build time by the `prebuild` script. This file is the half that
# runs without being remembered.

[graph]
# Dev-dependencies never reach a user's machine, so their licences impose
# nothing on the distributed binary.
exclude-dev = true

[licenses]
version = 2
# Below this, cargo-deny treats a licence file as unrecognised rather than
# guessing. An unidentified licence is exactly the case that needs a human.
confidence-threshold = 0.93
# The allow-list is deliberately forward-looking, so an entry no current crate
# happens to use is intended, not stale. Warning about those would train
# everyone to ignore this check's output.
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Compatible in the one direction that matters: these can be combined
    # into a GPL-3.0-or-later work. The reverse is not true, which is why
    # this list belongs to write and not to Mini Chat.
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]

[licenses.private]
# The workspace crate itself is not published; its own licence is LICENSE.
ignore = true

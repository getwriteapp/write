[package]
name = "write"
version = "0.4.4"
description = "A quiet, beautiful word processor."
authors = ["write contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "write_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Used ONLY to hand the releases URL to the OS — see open_releases_page in
# src/lib.rs. Its own open_url command is not granted to the webview.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Scheme validation for open_external_link — see its doc comment in lib.rs.
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
